<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d"><title id="t">Double-D coupling concept</title><desc id="d">Two flat faces on a round shaft engage a matching bore. Clearance between faces permits a small take-up angle. Torque passes through mating flats, with axial retention handled separately.</desc><rect width="760" height="350" fill="#e5eaf0"/><g fill="none" stroke="#536578" stroke-width="2"><circle cx="242" cy="174" r="119"/><path d="M175 77 H309 A118 118 0 0 1 309 271 H175 A118 118 0 0 1 175 77Z" fill="#f2f4f6"/><path d="M181 87 H303 A106 106 0 0 1 303 261 H181 A106 106 0 0 1 181 87Z" fill="#cbd3de"/><path d="M175 77H309 M175 271H309" stroke="#762c42" stroke-width="3"/><path d="M242 174L303 87 M242 174V87" stroke-dasharray="4 4"/><path d="M309 77H410 M309 87H410 M395 77V87" stroke="#762c42"/><path d="M323 271L417 286H450"/><path d="M242 174H403"/><path d="M125 128A126 126 0 0 0 126 221" stroke="#762c42"/><path d="M118 210L126 221L135 209" stroke="#762c42"/></g><g font-family="system-ui,sans-serif" fill="#202936"><text x="30" y="32" font-size="17" font-weight="600">Positive mechanical torque interface</text><text x="30" y="51" font-size="11" fill="#526071">Idealized cross section · clearance exaggerated</text><text x="427" y="85" font-size="13">Mating clearance</text><text x="418" y="178" font-size="13">Common shaft / bore axis</text><text x="463" y="290" font-size="13">Flat contact faces</text><text x="242" y="170" text-anchor="end" font-size="11">a</text><text x="278" y="128" font-size="11">R</text><text x="29" y="322" font-size="11" fill="#526071">Not to scale. Axial retention and installed load distribution are separate design questions.</text></g></svg>