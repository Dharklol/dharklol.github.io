<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="t d"><title id="t">Coupled steady-cornering solver architecture</title><desc id="d">Source configuration feeds trial geometry and contact, spring and anti-roll bar mechanics, tire forces and inertia. A Newton iteration solves the coupled balance equations and an independent force and moment audit checks the solution before reports are generated.</desc><rect width="760" height="310" fill="#e5eaf0"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536578"/></marker></defs><g font-family="system-ui,sans-serif" fill="#202936" text-anchor="middle" font-size="12"><g fill="#f2f4f6" stroke="#536578"><rect x="20" y="110" width="132" height="64" rx="4"/><rect x="187" y="30" width="153" height="54" rx="4"/><rect x="187" y="115" width="153" height="54" rx="4"/><rect x="187" y="200" width="153" height="54" rx="4"/><rect x="375" y="110" width="142" height="64" rx="4" stroke="#762c42" stroke-width="2"/><rect x="553" y="110" width="185" height="64" rx="4"/><rect x="553" y="217" width="185" height="54" rx="4"/></g><g fill="none" stroke="#536578" stroke-width="1.5" marker-end="url(#a)"><path d="M152 142H170V57H187"/><path d="M152 142H187"/><path d="M152 142H170V227H187"/><path d="M340 57H357V126H375"/><path d="M340 142H375"/><path d="M340 227H357V158H375"/><path d="M517 142H553"/><path d="M645 174V217"/><path d="M446 110V12H263V30" stroke="#762c42" stroke-dasharray="4 3"/></g><text x="86" y="137">Versioned inputs</text><text x="86" y="153" font-size="10">Geometry · setup · case</text><text x="263" y="53">Kinematics / contact</text><text x="263" y="69" font-size="10">Pose, gap, Jacobians</text><text x="263" y="137">Spring / ARB / gravity</text><text x="263" y="153" font-size="10">Force and virtual work</text><text x="263" y="222">Tire / motion</text><text x="263" y="238" font-size="10">Signed queries, inertia</text><text x="446" y="136">Coupled balance</text><text x="446" y="153" font-size="10">Bounded Newton solve</text><text x="645" y="136">Independent wrench audit</text><text x="645" y="153" font-size="10">Force and moment closure</text><text x="645" y="239">Evidence / reporting</text><text x="645" y="255" font-size="10">Results, failures, provenance</text><text x="352" y="25" font-size="10" fill="#762c42">Trial state feedback</text></g></svg>