name: Build and deploy portfolio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/projects/fsae/index.html
          test -f dist/projects/vehicle-dynamics/index.html
          test -f dist/projects/wydown/index.html
          test -f dist/documents/steering-fdr/index.html
          test -f dist/documents/wufr-26-steering-fdr/index.html
          test -f dist/resume/index.html
          test -s dist/documents/jesse-koeppel-resume.pdf
          test -s dist/documents/wufr-26-steering-fdr.pdf
          test -s dist/documents/wufr-27-steering-fdr.pdf
          test -s dist/documents/st-70401-aa-bevel-box-housing-left.pdf
          test -s dist/documents/st-70406-aa-secondary-shaft.pdf
      - name: Verify PDF readability and page counts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          for pdf in dist/documents/*.pdf; do
            pdfinfo "$pdf" | grep '^Pages:'
            pdftotext -f 1 -l 1 "$pdf" /tmp/portfolio-pdf-first-page.txt
            test -s /tmp/portfolio-pdf-first-page.txt
          done
          test "$(pdfinfo dist/documents/jesse-koeppel-resume.pdf | awk '/^Pages:/{print $2}')" = 1
          test "$(pdfinfo dist/documents/wufr-27-steering-fdr.pdf | awk '/^Pages:/{print $2}')" = 93
          test "$(pdfinfo dist/documents/st-70401-aa-bevel-box-housing-left.pdf | awk '/^Pages:/{print $2}')" = 1
          test "$(pdfinfo dist/documents/st-70406-aa-secondary-shaft.pdf | awk '/^Pages:/{print $2}')" = 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-preview
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
